[project]
name = "techjam-recsys-agent"
version = "0.1.0"
description = "Autonomous ML research agent for recommender systems - TikTok TechJam 2026 Track 2"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
